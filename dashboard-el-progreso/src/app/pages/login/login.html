
<div class="auth-container">
  <div class="auth-card">
    <div class="brand-icon">
      <i class="bi bi-box-seam"></i>
    </div>

    <h1>¡Bienvenido!</h1>
    <p class="subtitle">Distribuciones El Progreso</p>
    <p class="description">Ingresa a tu cuenta para continuar.</p>

    <form (ngSubmit)="iniciarSesion()">
      <label for="correo">Correo electrónico</label>
      <input
        id="correo"
        type="email"
        name="correo"
        [(ngModel)]="correo"
        placeholder="correo@ejemplo.com"
        required
      />

      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Ingresa tu contraseña"
        required
      />

      @if (mensaje) {
        <p class="error">{{ mensaje }}</p>
      }

      <button type="submit" class="btn-primary-custom">
        Iniciar sesión
      </button>
    </form>

    <p class="footer-text">
      ¿No tienes una cuenta?
      <a routerLink="/registro">Regístrate aquí</a>
    </p>
  </div>
</div>
